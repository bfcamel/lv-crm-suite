name: Prepare CRM 0.11.3

on:
  push:
    branches:
      - fix/0.11.3-security-stability

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited fixes
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Version bump.
          replace('lv-applications.php', ' * Version: 0.11.2', ' * Version: 0.11.3')
          replace('lv-applications.php', "define( 'LV_APPS_VERSION', '0.11.2' );", "define( 'LV_APPS_VERSION', '0.11.3' );")
          replace('includes/database/class-lv-db-migrator.php', "const PATCH_VERSION = '0.11.2';", "const PATCH_VERSION = '0.11.3';")

          # Volunteer contract must follow the common public-form requirement: name + phone + consent.
          replace(
              'includes/integration/class-lv-form-contracts.php',
              "'required' => array( 'contact_name', 'volunteer_age', 'contact_email', 'consent_personal_data' ),",
              "'required' => array( 'contact_name', 'contact_phone', 'volunteer_age', 'contact_email', 'consent_personal_data' ),"
          )

          # Restrict non-manager contact queries to contacts they are allowed to see.
          replace(
              'includes/contacts/class-lv-contact-query.php',
              "        $where[] = ( 'trash' === $f['view'] ) ? 'c.deleted_at IS NOT NULL' : 'c.deleted_at IS NULL';\n",
              "        $where[] = ( 'trash' === $f['view'] ) ? 'c.deleted_at IS NOT NULL' : 'c.deleted_at IS NULL';\n\n"
              "        // Editors/administrators are managers and may work with the whole CRM.\n"
              "        // Authors/contributors only see contacts they created/curate or contacts\n"
              "        // linked to applications that are currently visible to them.\n"
              "        if ( ! LV_Applications_Plugin::is_manager() ) {\n"
              "            $uid = get_current_user_id();\n"
              "            $apps = LV_Applications_Plugin::table_name();\n"
              "            $where[] = \"(c.created_by=%d OR c.curator_user_id=%d OR EXISTS (SELECT 1 FROM {$links} acl_l INNER JOIN {$apps} acl_a ON acl_a.id=acl_l.application_id WHERE acl_l.contact_id=c.id AND acl_a.deleted_at IS NULL AND (acl_a.assignee_id=0 OR acl_a.assignee_id=%d)))\";\n"
              "            array_push( $params, $uid, $uid, $uid );\n"
              "        }\n"
          )
          replace(
              'includes/contacts/class-lv-contact-query.php',
              "        $out['view'] = in_array( $view, array( 'active', 'trash' ), true ) ? $view : 'active';",
              "        $out['view'] = in_array( $view, array( 'active', 'trash' ), true ) ? $view : 'active';\n"
              "        if ( ! LV_Applications_Plugin::is_manager() ) $out['view'] = 'active';"
          )

          # Explicit object-level contact ACL and UI/AJAX enforcement.
          replace(
              'includes/class-lv-crm-extensions.php',
              "    public static function can_view_contacts(){return current_user_can('lv_view_applications');}\n    public static function is_contact_deleted($contact){return $contact&&!empty($contact->deleted_at);}\n    public static function can_edit_contact($contact){if(!$contact||!self::can_view_contacts()||self::is_contact_deleted($contact))return false;if(LV_Applications_Plugin::is_manager())return true;$uid=get_current_user_id();return absint($contact->created_by)===$uid||absint($contact->curator_user_id)===$uid;}\n",
              "    public static function can_view_contacts(){return current_user_can('lv_view_applications');}\n"
              "    public static function is_contact_deleted($contact){return $contact&&!empty($contact->deleted_at);}\n"
              "    public static function can_access_contact($contact){\n"
              "        if(!$contact||!self::can_view_contacts())return false;\n"
              "        if(LV_Applications_Plugin::is_manager())return true;\n"
              "        if(self::is_contact_deleted($contact))return false;\n"
              "        $uid=get_current_user_id();\n"
              "        if(absint($contact->created_by)===$uid||absint($contact->curator_user_id)===$uid)return true;\n"
              "        global$wpdb;\n"
              "        return(bool)$wpdb->get_var($wpdb->prepare(\n"
              "            'SELECT 1 FROM '.self::application_contacts_table().' l INNER JOIN '.LV_Applications_Plugin::table_name().' a ON a.id=l.application_id WHERE l.contact_id=%d AND a.deleted_at IS NULL AND (a.assignee_id=0 OR a.assignee_id=%d) LIMIT 1',\n"
              "            absint($contact->id),$uid\n"
              "        ));\n"
              "    }\n"
              "    public static function can_edit_contact($contact){if(!$contact||!self::can_access_contact($contact)||self::is_contact_deleted($contact))return false;if(LV_Applications_Plugin::is_manager())return true;$uid=get_current_user_id();return absint($contact->created_by)===$uid||absint($contact->curator_user_id)===$uid;}\n"
          )
          replace(
              'includes/class-lv-crm-extensions.php',
              "        foreach ( self::contacts_by_identity( $identity['emails'], $identity['phones'] ) as $c ) {\n            $m = self::contact_display_meta( $c );",
              "        foreach ( self::contacts_by_identity( $identity['emails'], $identity['phones'] ) as $c ) {\n            if ( ! self::can_access_contact( $c ) ) continue;\n            $m = self::contact_display_meta( $c );"
          )
          replace(
              'includes/class-lv-crm-extensions.php',
              "        foreach ( self::find_wp_users_by_identity( $identity['emails'], $identity['phones'] ) as $uid ) {",
              "        if ( LV_Applications_Plugin::is_manager() ) foreach ( self::find_wp_users_by_identity( $identity['emails'], $identity['phones'] ) as $uid ) {"
          )
          replace(
              'includes/class-lv-crm-extensions.php',
              "$params=array($like,$like,$like);if($digits)$params[]='%'.$wpdb->esc_like($digits).'%';$rows=$wpdb->get_results($wpdb->prepare($sql,$params));$rows=LV_Contact_Query::hydrate_rows($rows);$items=array();$linkedUsers=array();",
              "$params=array($like,$like,$like);if($digits)$params[]='%'.$wpdb->esc_like($digits).'%';$rows=$wpdb->get_results($wpdb->prepare($sql,$params));$rows=LV_Contact_Query::hydrate_rows($rows);if(!LV_Applications_Plugin::is_manager())$rows=array_values(array_filter($rows,array(__CLASS__,'can_access_contact')));$items=array();$linkedUsers=array();"
          )
          replace(
              'includes/class-lv-crm-extensions.php',
              "        foreach(self::search_wp_accounts($q,8) as$u){",
              "        if(LV_Applications_Plugin::is_manager())foreach(self::search_wp_accounts($q,8) as$u){"
          )
          replace(
              'includes/class-lv-crm-extensions.php',
              "        if(!$app||!$contact||!LV_Applications_Plugin::can_edit_application($app))wp_send_json_error(array('message'=>'Недостаточно прав.'),403);",
              "        if(!$app||!$contact||!LV_Applications_Plugin::can_edit_application($app)||!self::can_access_contact($contact))wp_send_json_error(array('message'=>'Недостаточно прав.'),403);"
          )
          replace(
              'includes/class-lv-crm-extensions.php',
              "        if($id&&!$contact)wp_die('Контакт не найден.');if($editing&&!self::can_view_contacts())wp_die('Недостаточно прав.');",
              "        if($id&&!$contact)wp_die('Контакт не найден.');if($editing&&!self::can_access_contact($contact))wp_die('Недостаточно прав.');"
          )

          # Contact list counters must respect the same ACL as the rows.
          replace(
              'includes/class-lv-crm-extensions.php',
              "        $all_count=(int)$wpdb->get_var('SELECT COUNT(*) FROM '.self::contacts_table().' WHERE deleted_at IS NULL');\n        $trash_count=(int)$wpdb->get_var('SELECT COUNT(*) FROM '.self::contacts_table().' WHERE deleted_at IS NOT NULL');\n        $mine_count=(int)$wpdb->get_var($wpdb->prepare('SELECT COUNT(*) FROM '.self::contacts_table().' WHERE deleted_at IS NULL AND curator_user_id=%d',get_current_user_id()));\n        $uncurated=(int)$wpdb->get_var('SELECT COUNT(*) FROM '.self::contacts_table().' WHERE deleted_at IS NULL AND curator_user_id=0');",
              "        $all_count=(new LV_Contact_Query(array('view'=>'active')))->count();\n"
              "        $trash_count=LV_Applications_Plugin::is_manager()?(new LV_Contact_Query(array('view'=>'trash')))->count():0;\n"
              "        $mine_count=(new LV_Contact_Query(array('view'=>'active','curator'=>'mine')))->count();\n"
              "        $uncurated=(new LV_Contact_Query(array('view'=>'active','curator'=>'none')))->count();"
          )

          # Dashboard contact count should not reveal a larger universe than the user can open.
          replace(
              'lv-applications.php',
              "        $contacts_total = class_exists( 'LV_CRM_Extensions' ) ? (int) $wpdb->get_var( 'SELECT COUNT(*) FROM ' . LV_CRM_Extensions::contacts_table() ) : 0;",
              "        $contacts_total = class_exists( 'LV_Contact_Query' ) ? ( new LV_Contact_Query( array( 'view' => 'active' ) ) )->count() : 0;"
          )

          # CSV/Excel formula injection protection for application CSV export.
          replace(
              'lv-applications.php',
              "    private function download_csv( $filename, $rows ) {",
              "    private static function sanitize_export_cell( $value ) {\n"
              "        if ( is_bool( $value ) ) $value = $value ? 'Да' : 'Нет';\n"
              "        if ( is_array( $value ) ) $value = implode( ', ', array_map( 'strval', $value ) );\n"
              "        $value = (string) $value;\n"
              "        // Keep ordinary international phone numbers readable, while neutralising\n"
              "        // cells that spreadsheet applications could evaluate as formulas.\n"
              "        if ( preg_match( '/^[=+\\-@]/u', $value ) && ! preg_match( '/^\\+[0-9\\s()\\-]+$/u', $value ) ) $value = \"'\" . $value;\n"
              "        return $value;\n"
              "    }\n\n"
              "    private function download_csv( $filename, $rows ) {"
          )
          replace(
              'lv-applications.php',
              "        foreach ( $rows as $row ) fputcsv( $out, $row, ';' );",
              "        foreach ( $rows as $row ) fputcsv( $out, array_map( array( __CLASS__, 'sanitize_export_cell' ), $row ), ';' );"
          )

          # Store new uploads outside the web-root by default; keep read/delete compatibility with legacy storage.
          replace(
              'lv-applications.php',
              "    public static function private_storage_dir() {\n        return WP_CONTENT_DIR . '/lv-applications-private';\n    }\n\n    public static function ensure_private_storage() {\n        $dir = self::private_storage_dir();\n        if ( ! is_dir( $dir ) ) wp_mkdir_p( $dir );\n        if ( is_dir( $dir ) ) {\n            if ( ! file_exists( $dir . '/index.php' ) ) @file_put_contents( $dir . '/index.php', \"<?php\\n// Silence is golden.\\n\" );\n            if ( ! file_exists( $dir . '/.htaccess' ) ) @file_put_contents( $dir . '/.htaccess', \"Deny from all\\n\" );\n            if ( ! file_exists( $dir . '/web.config' ) ) @file_put_contents( $dir . '/web.config', '<?xml version=\"1.0\"?><configuration><system.webServer><authorization><deny users=\"*\" /></authorization></system.webServer></configuration>' );\n        }\n    }",
              "    public static function legacy_private_storage_dir() {\n"
              "        return WP_CONTENT_DIR . '/lv-applications-private';\n"
              "    }\n\n"
              "    public static function private_storage_dir() {\n"
              "        // One level above the WordPress installation parent keeps static files\n"
              "        // outside the usual document root on Apache, Nginx and IIS deployments.\n"
              "        $parent = dirname( dirname( untrailingslashit( WP_CONTENT_DIR ) ) );\n"
              "        $site_key = substr( hash( 'sha256', untrailingslashit( ABSPATH ) ), 0, 12 );\n"
              "        $default = trailingslashit( $parent ) . 'lv-applications-private-' . $site_key;\n"
              "        $dir = (string) apply_filters( 'lv_applications_private_storage_dir', $default );\n"
              "        return untrailingslashit( wp_normalize_path( $dir ) );\n"
              "    }\n\n"
              "    public static function ensure_private_storage() {\n"
              "        $dir = self::private_storage_dir();\n"
              "        if ( ! is_dir( $dir ) && ! wp_mkdir_p( $dir ) ) return false;\n"
              "        if ( ! is_dir( $dir ) || ! is_writable( $dir ) ) return false;\n"
              "        if ( ! file_exists( $dir . '/index.php' ) ) @file_put_contents( $dir . '/index.php', \"<?php\\n// Silence is golden.\\n\" );\n"
              "        if ( ! file_exists( $dir . '/.htaccess' ) ) @file_put_contents( $dir . '/.htaccess', \"Deny from all\\n\" );\n"
              "        if ( ! file_exists( $dir . '/web.config' ) ) @file_put_contents( $dir . '/web.config', '<?xml version=\"1.0\"?><configuration><system.webServer><authorization><deny users=\"*\" /></authorization></system.webServer></configuration>' );\n"
              "        return true;\n"
              "    }\n\n"
              "    private static function stored_file_path( $application_id, $stored_name ) {\n"
              "        $application_id = absint( $application_id );\n"
              "        $stored_name = wp_basename( (string) $stored_name );\n"
              "        foreach ( array_unique( array( self::private_storage_dir(), self::legacy_private_storage_dir() ) ) as $base ) {\n"
              "            $path = $base . '/' . $application_id . '/' . $stored_name;\n"
              "            if ( is_file( $path ) && is_readable( $path ) ) return $path;\n"
              "        }\n"
              "        return '';\n"
              "    }"
          )
          replace(
              'lv-applications.php',
              "        self::ensure_private_storage();\n        $base = self::private_storage_dir();",
              "        if ( ! self::ensure_private_storage() ) return array();\n        $base = self::private_storage_dir();"
          )
          replace(
              'lv-applications.php',
              "        $path = self::private_storage_dir() . '/' . $id . '/' . $stored;\n        if ( ! is_file( $path ) || ! is_readable( $path ) ) wp_die( 'Файл не найден на сервере.' );",
              "        $path = self::stored_file_path( $id, $stored );\n        if ( ! $path ) wp_die( 'Файл не найден на сервере.' );"
          )
          replace(
              'lv-applications.php',
              "    private static function delete_application_files( $app ) {\n        $dir = self::private_storage_dir() . '/' . absint( $app->id );\n        if ( is_dir( $dir ) ) {\n            foreach ( glob( $dir . '/*' ) ?: array() as $file ) if ( is_file( $file ) ) @unlink( $file );\n            @rmdir( $dir );\n        }\n    }",
              "    private static function delete_application_files( $app ) {\n"
              "        foreach ( array_unique( array( self::private_storage_dir(), self::legacy_private_storage_dir() ) ) as $base ) {\n"
              "            $dir = $base . '/' . absint( $app->id );\n"
              "            if ( is_dir( $dir ) ) {\n"
              "                foreach ( glob( $dir . '/*' ) ?: array() as $file ) if ( is_file( $file ) ) @unlink( $file );\n"
              "                @rmdir( $dir );\n"
              "            }\n"
              "        }\n"
              "    }"
          )

          # README / release notes and runtime requirements.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('# CRM фонда «Люди и Верблюды» — 0.11.2', '# CRM фонда «Люди и Верблюды» — 0.11.3', 1)
          text = text.replace('Версия 0.11.2 продолжает интеграцию', 'Версия 0.11.3 исправляет найденные при аудите проблемы безопасности и стабильности и продолжает интеграцию', 1)
          marker = '## 0.11.2 — управление и удобство\n'
          notes = (
              '## 0.11.3 — безопасность и стабильность\n\n'
              '- ограничена видимость контактов для Авторов/Участников: доступны только созданные ими, курируемые либо связанные с доступными им заявками контакты;\n'
              '- закрыты прямые обходы ACL через карточку контакта, AJAX-поиск и ручную привязку контакта;\n'
              '- CSV-экспорт заявок защищён от spreadsheet/formula injection;\n'
              '- новые вложения заявок по умолчанию сохраняются вне обычного web-root, при этом старое хранилище остаётся доступно для чтения после обновления;\n'
              '- контракт формы «Волонтёр» теперь, как и остальные публичные формы, требует `contact_phone`;\n'
              '- добавлена автоматическая проверка синтаксиса PHP в GitHub Actions.\n\n'
          )
          if marker not in text:
              raise SystemExit('README marker not found')
          text = text.replace(marker, notes + marker, 1)
          text = text.replace('- PHP 7.4+;\n- Contact Form 7 для приёма публичных заявок.', '- PHP 7.4+;\n- PHP-расширение `ZipArchive` (`ext-zip`) для XLSX-экспорта;\n- Contact Form 7 для приёма публичных заявок.', 1)
          p.write_text(text, encoding='utf-8')

          # Permanent CI. The one-off preparer removes itself before committing.
          ci = Path('.github/workflows/php-lint.yml')
          ci.parent.mkdir(parents=True, exist_ok=True)
          ci.write_text('''name: PHP lint\n\non:\n  push:\n    branches: [ main ]\n  pull_request:\n\njobs:\n  lint:\n    runs-on: ubuntu-latest\n    strategy:\n      matrix:\n        php: [\"7.4\", \"8.1\", \"8.3\"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: shivammathur/setup-php@v2\n        with:\n          php-version: ${{ matrix.php }}\n          coverage: none\n      - name: Lint PHP\n        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l\n''', encoding='utf-8')

          Path('.gitignore').write_text((Path('.gitignore').read_text(encoding='utf-8') if Path('.gitignore').exists() else '') + '\n# Local release artefacts\ndist/\n*.zip\n', encoding='utf-8')
          Path('.github/workflows/prepare-0.11.3.yml').unlink()
          PY
          python /tmp/patch.py

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -rf /tmp/lv-build
          mkdir -p /tmp/lv-build/lv-applications
          cp -R assets includes README.md lv-applications.php /tmp/lv-build/lv-applications/
          cd /tmp/lv-build
          zip -qr /tmp/lv-applications-0.11.3.zip lv-applications
          unzip -t /tmp/lv-applications-0.11.3.zip

      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CRM security and stability issues for 0.11.3"
          git push origin HEAD:fix/0.11.3-security-stability

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lv-applications-0.11.3
          path: /tmp/lv-applications-0.11.3.zip
          if-no-files-found: error
