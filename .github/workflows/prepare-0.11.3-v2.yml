name: Prepare CRM 0.11.3 v2

on:
  push:
    branches:
      - fix/0.11.3-security-stability

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and apply audited patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/prepare-0.11.3.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if "cat > /tmp/patch.py <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          lines = src[start:end]
          out = []
          for line in lines:
              out.append(line[10:] if line.startswith('          ') else line.lstrip())
          Path('/tmp/patch.py').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          python /tmp/patch.py

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -rf /tmp/lv-build
          mkdir -p /tmp/lv-build/lv-applications
          cp -R assets includes README.md lv-applications.php /tmp/lv-build/lv-applications/
          cd /tmp/lv-build
          zip -qr /tmp/lv-applications-0.11.3.zip lv-applications
          unzip -t /tmp/lv-applications-0.11.3.zip

      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lv-applications.php includes README.md .gitignore
          git commit -m "Fix CRM security and stability issues for 0.11.3"
          git push origin HEAD:fix/0.11.3-security-stability

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lv-applications-0.11.3
          path: /tmp/lv-applications-0.11.3.zip
          if-no-files-found: error
